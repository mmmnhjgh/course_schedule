name: 构建与发布 Android APK

# 1. 触发时机：推送到 main 分支、推送 v 开头版本标签，或网页手动点击运行
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 允许自动创建 Release 并上传附件
permissions:
  contents: write

jobs:
  build-android:
    name: 检查、测试并打包 APK
    runs-on: ubuntu-latest

    steps:
      # 第 1 步：拉取仓库最新源码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第 2 步：配置 Java 21（Android Gradle Plugin 9.x 需要 JDK 17/21）
      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 第 3 步：安装并缓存与本地一致的 Flutter 3.50.1
      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      # 第 4 步：如已配置正式签名 Secrets，则还原 keystore 与 key.properties
      - name: 配置正式版签名（可选）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > android/release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
              "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            echo "已启用正式版签名配置"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，将回退使用默认签名"
          fi

      # 第 5 步：下载 Dart/Flutter 依赖包
      - name: 获取项目依赖
        run: flutter pub get

      # 第 6 步：静态检查（有错误直接终止，避免带着 Bug 打包）
      - name: 静态代码分析
        run: dart analyze

      # 第 7 步：运行全部单元与组件测试
      - name: 运行自动化测试
        run: flutter test

      # 第 8 步：编译分架构瘦身版与全架构通用正式 APK
      - name: 打包分架构与通用 Release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/QingKeBiao-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/QingKeBiao-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/QingKeBiao-universal.apk

      # 第 9 步：将编好的 APK 保存到本次构建产物（Artifacts）供下载
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QingKeBiao-release-apks
          path: release-apks/*.apk
          retention-days: 14

      # 第 10 步：如果本次推送的是 v* 标签（如 v2.0.0），自动发布到 Releases 页面
      - name: 自动创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
