name: course_schedule
description: "轻课表 - 纯本地、支持多源导入的 Flutter 安卓课表应用"
publish_to: 'none' # 私有应用，不发布到 pub.dev

version: 2.0.0+2

environment:
  sdk: ^3.14.0

# 运行期依赖包
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  file_picker: ^13.4.1
  excel: ^4.0.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6

# 测试与代码规范依赖
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter 资源与图标配置
flutter:
  uses-material-design: true

  assets:
    - assets/schools.json
